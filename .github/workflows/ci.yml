name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Run Zig unit tests
  test-zig:
    name: Zig Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run tests
        run: zig build test

  # Build native libraries for all platforms
  build-native:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            zig-target: aarch64-macos
            lib-name: libfuncode-darwin-arm64.dylib
            zig-output: libfuncode.dylib

          - platform: darwin-x64
            zig-target: x86_64-macos
            lib-name: libfuncode-darwin-x64.dylib
            zig-output: libfuncode.dylib

          - platform: linux-x64
            zig-target: x86_64-linux-gnu
            lib-name: libfuncode-linux-x64.so
            zig-output: libfuncode.so

          - platform: linux-arm64
            zig-target: aarch64-linux-gnu
            lib-name: libfuncode-linux-arm64.so
            zig-output: libfuncode.so

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build for ${{ matrix.platform }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }}
          mkdir -p artifacts
          cp zig-out/lib/${{ matrix.zig-output }} artifacts/${{ matrix.lib-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/${{ matrix.lib-name }}
          retention-days: 7

  # Integration tests with TypeScript
  test-integration:
    name: Integration Tests
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: ts/@byfungsi/fun/native
          pattern: native-*
          merge-multiple: true

      - name: List native libraries
        run: ls -la ts/@byfungsi/fun/native/

      - name: Install dependencies
        working-directory: ts/@byfungsi/fun
        run: bun install

      - name: Build TypeScript
        working-directory: ts/@byfungsi/fun
        run: bun run build

      - name: Run integration test
        working-directory: ts/@byfungsi/fun
        run: |
          bun -e "
          import { version, hash, generateDiff, loadOrCreateSession } from './dist/index.js';
          
          console.log('Version:', version());
          console.log('Hash test:', hash('hello').slice(0, 16) + '...');
          
          const diff = generateDiff('a\n', 'b\n', 'test.txt');
          console.log('Diff generated:', !!diff);
          
          const session = await loadOrCreateSession('/tmp/ci-test');
          await session.trackChange({
            filePath: 'test.txt',
            beforeContent: 'before',
            afterContent: 'after',
            agentId: 'ci',
            message: 'test'
          });
          
          const content = await session.getContentAtVersion('test.txt', 1);
          if (content !== 'after') throw new Error('Version mismatch');
          
          await session.delete();
          console.log('All integration tests passed!');
          "
